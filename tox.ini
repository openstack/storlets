[tox]
minversion = 4.28.0
envlist = py3,pep8

[testenv]
setenv =
  PYTHONPATH={toxinidir}/StorletSamples/python:{envdir}
  PYTHONDONTWRITEBYTECODE=1
constraints =
  {env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/master}
deps =
  -r{toxinidir}/requirements.txt
  -r{toxinidir}/test-requirements.txt
  git+https://opendev.org/openstack/swift.git
extras =
  docker
  podman
commands =
  stestr run --slowest --concurrency 1 {posargs}

[testenv:pep8python]
deps =
  hacking>=2.0,<7.1.0 # Apache-2.0
commands =
  flake8

[testenv:func]
deps =
  -r{toxinidir}/test-requirements.txt
setenv =
  STORLET_SAMPLE_PATH={toxinidir}/StorletSamples
  CLUSTER_CONF_DIR={toxinidir}
  OS_TEST_PATH=tests/functional
commands =
  stestr --test-path {env:OS_TEST_PATH} run --slowest --concurrency 1 {posargs}

[testenv:venv]
commands = {posargs}

[testenv:cover]
setenv =
  {[testenv]setenv}
  PYTHON=coverage run --source storlets --parallel-mode
commands =
  stestr run {posargs}
  coverage combine
  coverage html -d cover
  coverage xml -o cover/coverage.xml

[testenv:docs]
deps =
  -r{toxinidir}/requirements.txt
  -r{toxinidir}/doc/requirements.txt
  git+https://opendev.org/openstack/swift.git
commands =
  sphinx-build -a -W -E -b html doc/source doc/build/html

[testenv:debug]
commands = oslo_debug_helper {posargs}

[testenv:bashate]
deps =
  bashate # Apache-2.0
# Run bashate check for all bash scripts
# Ignores the following rules:
#   E006: Line longer than 79 columns
commands =
  bash -c "grep --recursive --binary-files=without-match \
    --files-with-match '^.!.*\(ba\)\?sh$' \
    --exclude-dir .tox \
    --exclude-dir .git \
    {toxinidir} | xargs bashate --error . --verbose --ignore=E006"
allowlist_externals =
  bash

[flake8]
# E123, E125 skipped as they are invalid PEP-8.
# H301: one import per line
# H306: imports not in alphabetical order (time, os)
# H404: multi line docstring should start without a leading new line
# H405: multi line docstring summary not separated with an empty line
# W503 line break before binary operator
# W504 line break after binary operator
ignore = E123,E125,H301,H306,H404,H405,W503,W504
show-source = True
builtins = _
exclude=.venv,.git,.tox,dist,doc,*openstack/common*,*lib/python*,*egg,build

[testenv:pep8]
skip_install = true
deps =
  {[testenv:pep8python]deps}
  {[testenv:bashate]deps}
commands =
  {[testenv:pep8python]commands}
  {[testenv:bashate]commands}
allowlist_externals =
  {[testenv:bashate]allowlist_externals}

[testenv:releasenotes]
skip_install = true
deps =
  -r{toxinidir}/doc/requirements.txt
commands = sphinx-build -a -W -E -d releasenotes/build/doctrees -b html releasenotes/source releasenotes/build/html

[testenv:codespell]
description =
  Run codespell to check spelling
deps = codespell
# note(JayF): {posargs} lets us run `tox -ecodespell -- -w` to get codespell
#             to correct spelling issues in our code it's aware of.
commands =
  codespell {posargs}
